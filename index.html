<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        body {
            background-color: #0d0d0d;
            height: 100vh;
            overflow: hidden;
        }
        .main-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
        }
        .typing-dot {
            animation: typingAnimation 1.4s infinite;
        }
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typingAnimation {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }
        pre code {
            border-radius: 0.5rem;
            padding: 1rem;
            display: block;
            overflow-x: auto;
        }
        .message-content p {
            margin-bottom: 0.5rem;
        }
        .message-content p:last-child {
            margin-bottom: 0;
        }
        .message-content ul, .message-content ol {
            margin-left: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .message-content li {
            margin-bottom: 0.25rem;
        }
        .message-content code:not(pre code) {
            background-color: #1e1e1e;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }
        .message-content pre {
            margin: 0.5rem 0;
            background-color: #1e1e1e;
            border-radius: 0.5rem;
            overflow-x: auto;
        }
        .message-content blockquote {
            border-left: 4px solid #4a4a4a;
            padding-left: 1rem;
            margin: 0.5rem 0;
            color: #a0a0a0;
        }
        .message-content a {
            color: #3b82f6;
            text-decoration: underline;
        }
        .message-content table {
            margin: 0.5rem 0;
            border-collapse: collapse;
            width: 100%;
        }
        .message-content th, .message-content td {
            border: 1px solid #333;
            padding: 0.5rem;
            text-align: left;
        }
        .message-content th {
            background-color: #1e1e1e;
        }
    </style>
</head>
<body class="text-gray-100">
    <div class="main-container max-w-4xl mx-auto p-4">
        <!-- Header -->
        <div class="mb-4 flex-shrink-0">
            <h1 class="text-xl sm:text-2xl font-bold text-white">AI Chat</h1>
        </div>

        <!-- Chat Container -->
        <div id="chatContainer" class="chat-container bg-gray-900 rounded-lg p-4 mb-4 space-y-4">
            <!-- Welcome Message -->
            <div class="flex justify-start">
                <div class="bg-gray-700 rounded-lg px-4 py-3 max-w-[85%] sm:max-w-[75%]">
                    <p class="text-sm text-gray-200">Hello! I'm your AI assistant. Start chatting!</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="flex gap-2 flex-shrink-0">
            <textarea 
                id="messageInput" 
                placeholder="Type your message..." 
                rows="1"
                class="flex-1 px-3 py-2 sm:px-4 sm:py-3 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none text-sm"
            ></textarea>
            <button 
                id="sendBtn" 
                class="px-4 py-2 sm:px-6 sm:py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors font-medium flex items-center justify-center"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Initialize marked with highlight.js
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true
        });

        // DOM Elements
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // Chat history
        let chatHistory = [];

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        // Send message on Enter (Shift+Enter for new line)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            
            const bubbleClass = isUser 
                ? 'bg-blue-600 text-white' 
                : 'bg-gray-700 text-gray-200';
            
            const parsedContent = isUser ? content : marked.parse(content);
            
            messageDiv.innerHTML = `
                <div class="${bubbleClass} rounded-lg px-4 py-3 max-w-[85%] sm:max-w-[75%]">
                    <div class="message-content text-sm">${parsedContent}</div>
                </div>
            `;
            
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
            
            // Add to chat history
            chatHistory.push({
                role: isUser ? 'user' : 'assistant',
                content: content
            });
        }

        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'flex justify-start';
            typingDiv.innerHTML = `
                <div class="bg-gray-700 rounded-lg px-4 py-3">
                    <div class="flex space-x-1">
                        <div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div>
                        <div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div>
                        <div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(typingDiv);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            
            if (!message) return;
            
            // Clear input
            messageInput.value = '';
            messageInput.style.height = 'auto';
            
            // Add user message
            addMessage(message, true);
            
            // Show typing indicator
            addTypingIndicator();
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [
                            {
                                role: 'system',
                                content: 'You are a helpful, concise assistant.'
                            },
                            ...chatHistory
                        ]
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                
                // Remove typing indicator
                removeTypingIndicator();
                
                // Create AI message container
                const messageDiv = document.createElement('div');
                messageDiv.className = 'flex justify-start';
                messageDiv.innerHTML = `
                    <div class="bg-gray-700 text-gray-200 rounded-lg px-4 py-3 max-w-[85%] sm:max-w-[75%]">
                        <div class="message-content text-sm" id="streamingContent"></div>
                    </div>
                `;
                chatContainer.appendChild(messageDiv);
                
                const streamingContent = document.getElementById('streamingContent');
                let fullResponse = '';
                let buffer = '';
                
                // Read stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            
                            try {
                                const parsed = JSON.parse(data);
                                const content = parsed.choices?.[0]?.delta?.content;
                                if (content) {
                                    buffer += content;
                                    fullResponse += content;
                                    
                                    // Display word by word
                                    const words = buffer.split(/(\s+)/);
                                    if (words.length > 1) {
                                        const displayContent = words.slice(0, -1).join('');
                                        streamingContent.innerHTML = marked.parse(displayContent);
                                        buffer = words.slice(-1).join('');
                                        scrollToBottom();
                                    }
                                }
                            } catch (e) {
                                // Skip invalid JSON
                            }
                        }
                    }
                }
                
                // Display remaining buffer
                if (buffer) {
                    streamingContent.innerHTML = marked.parse(fullResponse);
                    scrollToBottom();
                }
                
                // Add final response to chat history
                chatHistory.push({
                    role: 'assistant',
                    content: fullResponse
                });
                
                // Remove the temporary ID
                streamingContent.removeAttribute('id');
                
            } catch (error) {
                removeTypingIndicator();
                addMessage(`Error: ${error.message}`, false);
            }
        }
    </script>
</body>
</html>
